; PlatformIO project for the ESP32 OPC UA Server.
;
;   pio run
;   pio run -t upload
;   pio device monitor -b 115200
;
; This project is built with PlatformIO only.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; open62541 + Arduino core needs more than the default 1.2 MB app slot
board_build.partitions = huge_app.csv

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -Wno-unused-variable
