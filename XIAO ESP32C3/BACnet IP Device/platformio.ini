; PlatformIO project for the Seeed Studio XIAO ESP32C3 BACnet/IP device.
;
;   pio run
;   pio run -t upload
;   pio device monitor -b 115200
;
; This project is built with PlatformIO only.

[platformio]
default_envs = seeed_xiao_esp32c3

[env:seeed_xiao_esp32c3]
platform = espressif32@6.12.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
